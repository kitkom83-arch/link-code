<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b12" />
  <title>BN9 Activity</title>
  <link rel="stylesheet" href="styles.css?v=mobile-frame-20260524b" />
</head>
<body data-page="home">
  <main class="screen screen-home" aria-label="หน้าแรกกิจกรรม">
    <section class="reward-shell" aria-label="BN9 reward activity">
      <div class="brand-row">
        <strong>BN9.ONE</strong>
        <span>Reward Link</span>
      </div>

      <section class="phone-panel" aria-label="กิจกรรมรับโค้ด">
        <div class="phone" id="rewardPhone">
          <span class="spark spark-one"></span>
          <span class="spark spark-two"></span>
          <span class="spark spark-three"></span>

          <div class="step-label" aria-hidden="true">1</div>

          <div class="phone-inner">
            <div class="visual-frame">
              <img id="heroImage" class="hero-image" alt="Activity image" />
              <div class="slot-machine" aria-hidden="true">
                <div class="machine-top"></div>
                <div class="machine-star">★</div>
                <div class="machine-body"></div>
                <div class="machine-reels">
                  <span>7</span>
                  <span>7</span>
                  <span>7</span>
                </div>
                <div class="machine-handle"></div>
                <div class="machine-base"></div>
              </div>
            </div>

            <div class="action-zone">
              <button id="actionButton" class="main-button" type="button">
                <span id="buttonIcon" class="button-icon" aria-hidden="true"></span>
                <span id="buttonText" class="button-text"></span>
              </button>
            </div>

            <a id="footerLink" class="site-pill" href="#" target="_blank" rel="noopener noreferrer">
              <span class="globe" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3.2a15 15 0 0 0-1.1-5 8.05 8.05 0 0 1 4.3 5ZM12 4.04c.74 1.07 1.48 2.8 1.73 4.96h-3.46c.25-2.16.99-3.89 1.73-4.96ZM4.26 13h3.03c.08 1.8.42 3.45.95 4.77A8.02 8.02 0 0 1 4.26 13Zm3.03-2H4.26a8.02 8.02 0 0 1 3.98-4.77A15.33 15.33 0 0 0 7.29 11ZM12 19.96c-.74-1.07-1.48-2.8-1.73-4.96h3.46c-.25 2.16-.99 3.89-1.73 4.96ZM14.1 13H9.9a20.7 20.7 0 0 1 0-2h4.2a20.7 20.7 0 0 1 0 2Zm1.66 4.77c.53-1.32.87-2.97.95-4.77h3.03a8.02 8.02 0 0 1-3.98 4.77ZM16.71 11a15.33 15.33 0 0 0-.95-4.77A8.02 8.02 0 0 1 19.74 11h-3.03Z"/></svg>
              </span>
              <span id="footerText"></span>
            </a>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="EDIT-HERE.js"></script>
  <script src="app.js"></script>
</body>
</html>
