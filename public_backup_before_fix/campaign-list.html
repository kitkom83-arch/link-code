<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BN9 Campaign Links</title>
  <style>
    :root { color-scheme: dark; --bg:#050505; --panel:#111; --line:#2b2b2b; --text:#fff; --muted:#bdbdbd; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; font-family:ui-sans-serif,system-ui,"Noto Sans Thai",Arial,sans-serif; background:var(--bg); color:var(--text); }
    main { width:min(920px, 92vw); margin:0 auto; padding:48px 0 72px; }
    h1 { font-size:clamp(28px,4vw,46px); margin:0 0 12px; }
    p { color:var(--muted); line-height:1.65; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:22px; margin-top:22px; }
    .grid { display:grid; gap:14px; margin-top:18px; }
    a.link { display:flex; justify-content:space-between; gap:18px; padding:16px 18px; border:1px solid var(--line); border-radius:16px; color:var(--text); text-decoration:none; background:#0b0b0b; }
    a.link:hover { border-color:#fff; }
    code { background:#000; border:1px solid var(--line); border-radius:8px; padding:2px 7px; color:#fff; }
    .path { color:#7dd3fc; word-break:break-all; }
    .warn { border-color:#5f4b00; background:#211900; }
  </style>
</head>
<body>
  <main>
    <h1>BN9 Campaign Links</h1>
    <p>หน้านี้ไว้เช็กว่ามีงานอะไรอยู่ในไฟล์ชุดนี้บ้าง พี่โปรโมทลิงก์ตามชื่อโฟลเดอร์ได้เลย</p>

    <section class="card warn">
      <strong>จำง่าย ๆ:</strong>
      <p>งานใหม่ = copy โฟลเดอร์ <code>template-campaign</code> แล้วเปลี่ยนชื่อ เช่น <code>free100</code> จากนั้นอัปโฟลเดอร์หลักทั้งก้อนขึ้น Worker เดิม</p>
    </section>

    <section class="card">
      <h2>ลิงก์ในชุดนี้</h2>
      <div id="links" class="grid"></div>
    </section>
  </main>

  <script src="campaign-list.js"></script>
  <script>
    const wrap = document.getElementById('links');
    const origin = window.location.origin;
    (window.BN9_CAMPAIGNS || []).forEach(item => {
      const a = document.createElement('a');
      a.className = 'link';
      a.href = item.path;
      const full = origin + item.path;
      a.innerHTML = '<span><strong>' + item.name + '</strong><br><span class="path">' + full + '</span></span><span>เปิด</span>';
      wrap.appendChild(a);
    });
  </script>
</body>
</html>
