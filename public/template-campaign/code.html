<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b12" />
  <title>BN9 Code</title>
  <link rel="stylesheet" href="styles.css?v=mobile-frame-20260524b" />
</head>
<body data-page="code">
  <main class="screen screen-code" aria-label="หน้ารับโค้ด">
    <section class="reward-shell" aria-label="BN9 reward code">
      <div class="brand-row">
        <strong>BN9.ONE</strong>
        <span>Reward Code</span>
      </div>

      <section class="phone-panel" aria-label="รับโค้ดและเข้าสู่ระบบ">
        <div class="phone phone-code" id="rewardPhone">
          <span class="spark spark-one"></span>
          <span class="spark spark-two"></span>
          <span class="spark spark-three"></span>

          <div class="step-label" aria-hidden="true">2</div>

          <div class="phone-inner">
            <div class="visual-frame compact">
              <img id="heroImage" class="hero-image" alt="Activity image" />
              <div class="slot-machine is-small" aria-hidden="true">
                <div class="machine-top"></div>
                <div class="machine-star">★</div>
                <div class="machine-body"></div>
                <div class="machine-reels">
                  <span>7</span>
                  <span>7</span>
                  <span>7</span>
                </div>
                <div class="machine-handle"></div>
                <div class="machine-base"></div>
              </div>
            </div>

            <div class="code-box" aria-label="Reward code box">
              <div class="code-row">
                <input id="rewardCode" class="code-input" type="text" readonly value="" />
                <button id="copyButton" class="copy-button" type="button">copy</button>
              </div>
              <p id="codeHint" class="code-hint"></p>
            </div>

            <button id="loginButton" class="login-button" type="button">LOGIN</button>
            <div id="loginEmbedWrap" class="login-embed-wrap" hidden>
              <iframe id="loginEmbed" class="login-embed" title="Login embedded page" loading="lazy"></iframe>
            </div>

            <a id="footerLink" class="site-pill" href="#" target="_blank" rel="noopener noreferrer">
              <span class="globe" aria-hidden="true">
                <svg viewBox="0 0 24 24" role="img"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm6.9 9h-3.2a15 15 0 0 0-1.1-5 8.05 8.05 0 0 1 4.3 5ZM12 4.04c.74 1.07 1.48 2.8 1.73 4.96h-3.46c.25-2.16.99-3.89 1.73-4.96ZM4.26 13h3.03c.08 1.8.42 3.45.95 4.77A8.02 8.02 0 0 1 4.26 13Zm3.03-2H4.26a8.02 8.02 0 0 1 3.98-4.77A15.33 15.33 0 0 0 7.29 11ZM12 19.96c-.74-1.07-1.48-2.8-1.73-4.96h3.46c-.25 2.16-.99 3.89-1.73 4.96ZM14.1 13H9.9a20.7 20.7 0 0 1 0-2h4.2a20.7 20.7 0 0 1 0 2Zm1.66 4.77c.53-1.32.87-2.97.95-4.77h3.03a8.02 8.02 0 0 1-3.98 4.77ZM16.71 11a15.33 15.33 0 0 0-.95-4.77H19.74A8.02 8.02 0 0 1 15.76 6.23Z"/></svg>
              </span>
              <span id="footerText"></span>
            </a>
          </div>
        </div>
      </section>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite">คัดลอกโค้ดแล้ว</div>
  </main>

  <script src="EDIT-HERE.js?v=20260601094749"></script>
  <script src="app.js?v=20260601094749"></script>
</body>
</html>
